name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Replace with your default branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: [oven-sh/setup-bun@v2](https://github.com/marketplace/actions/setup-bun)
        with:
          bun-version: latest # Or specify a version like 1.0.0

      - name: Install dependencies
        run: bun install

      - name: Build site
        run: bun run build # Ensure your package.json has a build script

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Replace with your build output directory (e.g., ./_site)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
